services:
  web:
    image: cpjudge:local
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:5000 "run:app"
    ports:
      - "${PORT:-5050}:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in a .env file}
      - DATABASE_URL=${DATABASE_URL:-}
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-docker}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-cpjudge:local}
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Karachi
      - APP_TIMEZONE=Asia/Karachi
    restart: unless-stopped

  worker:
    image: cpjudge:local
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m cpjudge.worker
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=worker
      - DATABASE_URL=${DATABASE_URL:-}
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-docker}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-cpjudge:local}
      - SANDBOX_USER=${SANDBOX_USER:-judge_sandbox}
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Karachi
      - APP_TIMEZONE=Asia/Karachi
    depends_on:
      - web
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
    command: pytest -v
    volumes:
      - .:/app
    environment:
      - TZ=Asia/Karachi
      - APP_TIMEZONE=Asia/Karachi
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
