services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cpjudge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=cpjudge
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpjudge"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: cpjudge:local
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:5000 "run:app"
    ports:
      - "${PORT:-5050}:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in a .env file}
      - DATABASE_URL=postgresql://cpjudge:${POSTGRES_PASSWORD}@db/cpjudge
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-docker}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-cpjudge:local}
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Karachi
      - APP_TIMEZONE=Asia/Karachi
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: cpjudge:local
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m cpjudge.worker --poll-interval 0.2
    volumes:
      - .:/app
      # NOTE: no docker.sock needed with bwrap!
    environment:
      - FLASK_ENV=worker
      - DATABASE_URL=postgresql://cpjudge:${POSTGRES_PASSWORD}@db/cpjudge
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-bwrap}
      - SANDBOX_USER=${SANDBOX_USER:-judge_sandbox}
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Karachi
      - APP_TIMEZONE=Asia/Karachi
    cap_add:
      - SYS_ADMIN          # ← required for bwrap user namespaces
    security_opt:
      - apparmor:unconfined # ← required on Ubuntu hosts with AppArmor
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    deploy:
      replicas: 3
    restart: unless-stopped
  
  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile
    command: pytest -v
    volumes:
      - .:/app
    environment:
      - TZ=Asia/Karachi
      - APP_TIMEZONE=Asia/Karachi
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined

volumes:
  pgdata:
